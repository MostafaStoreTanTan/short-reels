<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script>
(function () {
  // Paste the SAME Firebase web config into index.html and login.html.
  const FIREBASE_CONFIGURED = false;
  const FIREBASE_CONFIG = {
    apiKey: "YOUR_FIREBASE_API_KEY",
    authDomain: "YOUR_PROJECT.firebaseapp.com",
    projectId: "YOUR_PROJECT_ID",
    appId: "YOUR_FIREBASE_APP_ID"
  };

  window.__shortRellsUser = null;
  window.__shortRellsAuthReady = false;

  if (FIREBASE_CONFIGURED && window.firebase) {
    try {
      if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
      firebase.auth().onAuthStateChanged(function (user) {
        window.__shortRellsUser = user || null;
        window.__shortRellsAuthReady = true;
      });
    } catch (error) {
      console.error("SHORT Rells Firebase initialization failed:", error);
      window.__shortRellsAuthReady = true;
    }
  } else {
    window.__shortRellsAuthReady = true;
  }

  const style = document.createElement("style");
  style.textContent = `
    .sr-auth-overlay{position:fixed;inset:0;z-index:99999;background:rgba(0,0,0,.78);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;padding:20px}
    .sr-auth-dialog{width:min(100%,440px);background:#141418;border:1px solid #33333e;border-radius:22px;padding:28px;color:#fff;box-shadow:0 25px 80px rgba(0,0,0,.55);font-family:inherit}
    .sr-auth-dialog h2{font-size:23px;font-weight:800;margin:0 0 10px}
    .sr-auth-dialog p{color:#a1a1aa;line-height:1.65;margin:0 0 22px;font-size:14px}
    .sr-auth-actions{display:grid;gap:10px}
    .sr-auth-actions button{min-height:46px;border-radius:999px;padding:10px 16px;font-weight:700;cursor:pointer}
    .sr-auth-primary{background:#e50914;color:white}
    .sr-auth-guest{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.18);color:white}
    .sr-auth-cancel{background:transparent;color:#a1a1aa}
    @media(max-width:480px){.sr-auth-dialog{padding:23px 19px}.sr-auth-dialog h2{font-size:20px}}
  `;
  document.head.appendChild(style);

  window.__shortRellsAskToRegister = function (continueAsGuest) {
    if (window.__shortRellsUser) {
      continueAsGuest();
      return;
    }
    const existing = document.getElementById("sr-auth-overlay");
    if (existing) existing.remove();

    const overlay = document.createElement("div");
    overlay.id = "sr-auth-overlay";
    overlay.className = "sr-auth-overlay";
    overlay.innerHTML = `
      <section class="sr-auth-dialog" role="dialog" aria-modal="true" aria-labelledby="sr-auth-title">
        <div style="width:42px;height:42px;border-radius:12px;background:#e50914;display:grid;place-items:center;font-weight:900;font-size:21px;margin-bottom:18px">S</div>
        <h2 id="sr-auth-title">Create an account to continue</h2>
        <p>Would you like to create an account or sign in before watching? You can also continue watching as a guest.</p>
        <div class="sr-auth-actions">
          <button type="button" class="sr-auth-primary" id="sr-auth-login">Sign In / Register</button>
          <button type="button" class="sr-auth-guest" id="sr-auth-guest">Continue as Guest</button>
          <button type="button" class="sr-auth-cancel" id="sr-auth-cancel">Cancel</button>
        </div>
      </section>`;
    document.body.appendChild(overlay);

    const close = () => overlay.remove();
    overlay.addEventListener("click", event => { if (event.target === overlay) close(); });
    overlay.querySelector("#sr-auth-login").addEventListener("click", () => {
      window.location.href = "login.html?next=" + encodeURIComponent("index.html");
    });
    overlay.querySelector("#sr-auth-guest").addEventListener("click", () => {
      close();
      continueAsGuest();
    });
    overlay.querySelector("#sr-auth-cancel").addEventListener("click", close);
  };
})();
</script>
