:root{
  --bg:#080808;
  --surface:#151515;
  --surface-2:#1d1d1d;
  --surface-3:#262626;
  --accent:#E50914;
  --accent-2:#ff2d38;
  --text:#ffffff;
  --muted:#A1A1AA;
  --border:#2a2a2a;
  --success:#22c55e;
  --warn:#f59e0b;
  --danger:#ef4444;
  --safe-area-inset-top: var(--safe-area-inset-top, 0px);
}

@media (prefers-color-scheme: dark){
  :root{
    --bg:#080808;
    --surface:#151515;
    --text:#ffffff;
  }
}

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
}

html[dir="rtl"] body, [dir="rtl"]{
  font-family:Inter, "Segoe UI", Tahoma, "Noto Kufi Arabic", "Arabic Typesetting", sans-serif;
  line-height:1.75;
}

[dir="rtl"] .nav-item{
  text-align:right;
}

[dir="rtl"] th{
  text-align:right;
}

[dir="rtl"] .label{
  letter-spacing:0;
}

button,input,select,textarea{
  font-family:inherit;
}

button{
  cursor:pointer;
}

button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, a:focus-visible{
  outline:2px solid var(--accent);
  outline-offset:2px;
}

::-webkit-scrollbar{
  width:10px;
  height:10px;
}

::-webkit-scrollbar-thumb{
  background:#333;
  border-radius:99px;
}

::-webkit-scrollbar-track{
  background:#0d0d0d;
}

.mono{
  font-family:"JetBrains Mono", ui-monospace, monospace;
}

.card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:16px;
}

.input{
  width:100%;
  background:#0f0f0f;
  border:1px solid #2e2e2e;
  color:#fff;
  border-radius:10px;
  padding:11px 13px;
  font-size:14px;
}

.input::-moz-placeholder{
  color:#6b6b6b;
}

.input::placeholder{
  color:#6b6b6b;
}

.input-error{
  border-color:#ef4444 !important;
}

.label{
  font-size:12px;
  font-weight:700;
  letter-spacing:.06em;
  text-transform:uppercase;
  color:var(--muted);
  margin-bottom:6px;
  display:block;
}

.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  border-radius:10px;
  padding:10px 14px;
  font-weight:700;
  font-size:14px;
  border:1px solid transparent;
  transition:.15s;
  white-space:nowrap;
}

.btn:active{
  transform:translateY(1px);
}

.btn-primary{
  background:var(--accent);
  color:#fff;
}

.btn-primary:hover{
  background:#ff1a26;
}

.btn-ghost{
  background:#222;
  color:#fff;
  border-color:#333;
}

.btn-ghost:hover{
  background:#2c2c2c;
}

.btn-danger{
  background:#3a1416;
  color:#ff9a9a;
  border-color:#5a1f23;
}

.pill{
  display:inline-flex;
  align-items:center;
  gap:5px;
  padding:4px 9px;
  border-radius:999px;
  font-size:11px;
  font-weight:800;
  letter-spacing:.02em;
}

.pill-green{
  background:#12331f;
  color:#7ee2a8;
  border:1px solid #1f5a35;
}

.pill-amber{
  background:#38260a;
  color:#fbbf24;
  border:1px solid #6b4a12;
}

.pill-gray{
  background:#222;
  color:#c9c9c9;
  border:1px solid #333;
}

.pill-red{
  background:#3a1416;
  color:#ff9a9a;
  border:1px solid #5a1f23;
}

.nav-item{
  display:flex;
  align-items:center;
  gap:11px;
  width:100%;
  text-align:left;
  padding:11px 12px;
  border-radius:11px;
  color:#c8c8c8;
  font-weight:600;
  font-size:14px;
  border:1px solid transparent;
  background:transparent;
}

.nav-item:hover{
  background:#222;
  color:#fff;
}

.nav-item.active{
  background:#2a0d0e;
  color:#fff;
  border-color:#4a1a1d;
}

.nav-item.active .nav-dot{
  background:var(--accent);
  box-shadow:0 0 0 4px rgba(229,9,20,.18);
}

.chip{
  padding:7px 11px;
  border-radius:999px;
  background:#1e1e1e;
  border:1px solid #2d2d2d;
  font-size:13px;
  font-weight:600;
  color:#ddd;
}

.chip.active{
  background:var(--accent);
  border-color:var(--accent);
  color:#fff;
}

@keyframes fadeUp{
  from{
    opacity:0;
    transform:translateY(8px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }
}

@keyframes slideIn{
  from{
    opacity:0;
    transform:translateY(10px) scale(.98);
  }

  to{
    opacity:1;
    transform:translateY(0) scale(1);
  }
}

@keyframes shimmer{
  from{
    background-position:-400px 0;
  }

  to{
    background-position:400px 0;
  }
}

.anim-in{
  animation:fadeUp .35s ease both;
}

.modal-in{
  animation:slideIn .22s ease both;
}

.skeleton{
  background:linear-gradient(90deg,#1a1a1a 25%,#2a2a2a 37%,#1a1a1a 63%);
  background-size:800px 100%;
  animation:shimmer 1.2s infinite;
}

.bar{
  transition:height .5s ease;
}

.poster{
  -o-object-fit:cover;
     object-fit:cover;
  background:#222;
}

.table-wrap{
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:720px;
}

th{
  text-align:left;
  font-size:11px;
  letter-spacing:.08em;
  text-transform:uppercase;
  color:var(--muted);
  padding:12px 14px;
  border-bottom:1px solid #2a2a2a;
}

td{
  padding:13px 14px;
  border-bottom:1px solid #222;
  vertical-align:middle;
  font-size:14px;
}

.poster-placeholder{
  width:100%;
  height:100%;
  min-height:56px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:6px;
  padding:12px;
  text-align:center;
  overflow:hidden;
}

.ph-icon{
  width:44px;
  height:44px;
  border-radius:999px;
  background:rgba(255,255,255,.06);
  border:1px solid #333;
  display:grid;
  place-items:center;
}

.ph-title{
  font-weight:800;
  font-size:13px;
  line-height:1.25;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
  overflow-wrap:anywhere;
}

.ph-path{
  font-size:10px;
  color:#A1A1AA;
  overflow-wrap:anywhere;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
}

.ph-badge{
  font-size:9px;
  font-weight:900;
  letter-spacing:.12em;
  border:1px solid #333;
  border-radius:999px;
  padding:3px 7px;
}

.lang-pills{
  display:inline-flex;
  gap:4px;
  background:#151515;
  border:1px solid #2a2a2a;
  border-radius:999px;
  padding:4px;
}

.lang-pill{
  min-width:38px;
  padding:7px 8px;
  border-radius:999px;
  font-size:12px;
  font-weight:800;
  color:#A1A1AA;
  background:transparent;
  border:1px solid transparent;
}

.lang-pill.active{
  background:#E50914;
  color:#fff;
}

@media (max-width:640px){
  table{
    min-width:0;
  }
}

.placeholder\:text-\[\#666\]::-moz-placeholder{
  --tw-text-opacity: 1;
  color: rgb(102 102 102 / var(--tw-text-opacity, 1));
}

.placeholder\:text-\[\#666\]::placeholder{
  --tw-text-opacity: 1;
  color: rgb(102 102 102 / var(--tw-text-opacity, 1));
}

@media (min-width: 640px){
  .sm\:col-span-2{
    grid-column: span 2 / span 2;
  }

  .sm\:my-10{
    margin-top: 2.5rem;
    margin-bottom: 2.5rem;
  }

  .sm\:block{
    display: block;
  }

  .sm\:inline-flex{
    display: inline-flex;
  }

  .sm\:grid-cols-2{
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .sm\:grid-cols-3{
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .sm\:gap-4{
    gap: 1rem;
  }

  .sm\:p-5{
    padding: 1.25rem;
  }

  .sm\:p-6{
    padding: 1.5rem;
  }

  .sm\:p-7{
    padding: 1.75rem;
  }

  .sm\:px-6{
    padding-left: 1.5rem;
    padding-right: 1.5rem;
  }
}

@media (min-width: 768px){
  .md\:flex{
    display: flex;
  }

  .md\:grid-cols-2{
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .md\:grid-cols-3{
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
}

@media (min-width: 1024px){
  .lg\:col-span-2{
    grid-column: span 2 / span 2;
  }

  .lg\:flex{
    display: flex;
  }

  .lg\:hidden{
    display: none;
  }

  .lg\:grid-cols-2{
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .lg\:grid-cols-3{
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .lg\:grid-cols-4{
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }

  .lg\:grid-cols-5{
    grid-template-columns: repeat(5, minmax(0, 1fr));
  }
}

@media (min-width: 1280px){
  .xl\:grid-cols-3{
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
}
