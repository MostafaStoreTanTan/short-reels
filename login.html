:root{
  --bg:#080808;
  --secondary:#151515;
  --accent:#E50914;
  --accent-2:#ff2e3a;
  --white:#FFFFFF;
  --muted:#A1A1AA;
  --line:rgba(255,255,255,.12);
  --surface:rgba(21,21,21,.62);
  --safe-area-inset-top: env(safe-area-inset-top, 0px);
}

*{
  box-sizing:border-box
}

html,body{
  margin:0;
  background:var(--bg);
  color:var(--white);
  font-family:ui-sans-system,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased
}

a{
  color:inherit
}

button{
  font:inherit
}

:focus-visible{
  outline:2px solid var(--accent);
  outline-offset:2px;
  border-radius:8px
}

@keyframes rise{
  from{
    opacity:0;
    transform:translateY(18px) scale(.98)
  }

  to{
    opacity:1;
    transform:translateY(0) scale(1)
  }
}

@keyframes glowA{
  0%,100%{
    transform:translate(-10%,-6%) scale(1);
    opacity:.75
  }

  50%{
    transform:translate(4%,3%) scale(1.12);
    opacity:.95
  }
}

@keyframes glowB{
  0%,100%{
    transform:translate(12%,10%) scale(1);
    opacity:.55
  }

  50%{
    transform:translate(-4%,-4%) scale(1.15);
    opacity:.8
  }
}

@keyframes pulseDot{
  0%,100%{
    box-shadow:0 0 0 0 rgba(229,9,20,.55)
  }

  50%{
    box-shadow:0 0 0 7px rgba(229,9,20,0)
  }
}

@keyframes spin{
  to{
    transform:rotate(360deg)
  }
}

.rise{
  animation:rise .65s cubic-bezier(.2,.8,.2,1) both
}

.glow-a{
  animation:glowA 11s ease-in-out infinite
}

.glow-b{
  animation:glowB 13s ease-in-out infinite
}

.glass{
  background:linear-gradient(160deg,rgba(255,255,255,.10),rgba(255,255,255,.03) 42%,rgba(229,9,20,.06));
  backdrop-filter:blur(22px);
  -webkit-backdrop-filter:blur(22px);
  border:1px solid rgba(255,255,255,.14);
  box-shadow:0 28px 80px rgba(0,0,0,.65),0 0 0 1px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.12)
}

.field{
  width:100%;
  min-height:48px;
  background:rgba(8,8,8,.58);
  border:1px solid rgba(255,255,255,.15);
  color:#fff;
  border-radius:12px;
  padding:0 14px;
  font-size:15px;
  transition:border-color .2s, box-shadow .2s, background .2s
}

.field::-moz-placeholder{
  color:#6b6b72
}

.field::placeholder{
  color:#6b6b72
}

.field:focus{
  outline:none;
  border-color:rgba(229,9,20,.85);
  box-shadow:0 0 0 3px rgba(229,9,20,.22),0 0 24px rgba(229,9,20,.18);
  background:rgba(8,8,8,.72)
}

.field-error{
  border-color:#ff5a66!important;
  box-shadow:0 0 0 3px rgba(255,90,102,.14)!important
}

.btn-primary{
  width:100%;
  min-height:48px;
  border:0;
  border-radius:12px;
  background:linear-gradient(180deg,#ff1f2b,#c00610);
  color:#fff;
  font-weight:800;
  letter-spacing:.02em;
  cursor:pointer;
  box-shadow:0 14px 30px rgba(229,9,20,.35),inset 0 1px 0 rgba(255,255,255,.28);
  transition:transform .18s, box-shadow .18s, filter .18s;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px
}

.btn-primary:hover:not(:disabled){
  transform:translateY(-1px);
  filter:brightness(1.08);
  box-shadow:0 18px 36px rgba(229,9,20,.45)
}

.btn-primary:active:not(:disabled){
  transform:translateY(0)
}

.btn-primary:disabled{
  opacity:.65;
  cursor:not-allowed
}

.btn-ghost{
  width:100%;
  min-height:48px;
  border:1px solid rgba(255,255,255,.18);
  background:rgba(255,255,255,.06);
  color:#fff;
  border-radius:12px;
  font-weight:700;
  cursor:pointer;
  transition:background .18s, transform .18s
}

.btn-ghost:hover{
  background:rgba(255,255,255,.11);
  transform:translateY(-1px)
}

.spinner{
  width:18px;
  height:18px;
  border:2px solid rgba(255,255,255,.35);
  border-top-color:#fff;
  border-radius:50%;
  animation:spin .7s linear infinite;
  flex:none
}

.lang-pill{
  min-height:36px;
  min-width:42px;
  padding:0 10px;
  border-radius:999px;
  border:1px solid rgba(255,255,255,.16);
  background:rgba(255,255,255,.05);
  color:#d6d6da;
  font-weight:800;
  font-size:13px;
  cursor:pointer
}

.lang-pill[aria-pressed="true"]{
  background:var(--accent);
  border-color:var(--accent);
  color:#fff;
  box-shadow:0 8px 22px rgba(229,9,20,.4)
}

@media (prefers-color-scheme: dark){
  :root{
    --bg:#080808
  }
}

.hover\:text-red-200:hover {
  --tw-text-opacity: 1;
  color: rgb(254 202 202 / var(--tw-text-opacity, 1));
}

.hover\:text-white:hover {
  --tw-text-opacity: 1;
  color: rgb(255 255 255 / var(--tw-text-opacity, 1));
}

@media (min-width: 640px) {
  .sm\:p-8 {
    padding: 2rem;
  }

  .sm\:px-6 {
    padding-left: 1.5rem;
    padding-right: 1.5rem;
  }

  .sm\:py-10 {
    padding-top: 2.5rem;
    padding-bottom: 2.5rem;
  }

  .sm\:py-5 {
    padding-top: 1.25rem;
    padding-bottom: 1.25rem;
  }
}

@media (min-width: 1024px) {
  .lg\:px-8 {
    padding-left: 2rem;
    padding-right: 2rem;
  }
}
