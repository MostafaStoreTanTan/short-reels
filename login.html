<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#09090b">
<title>Sign In / Register — SHORT Rells</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#09090b;color:#fff;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;place-items:center;padding:22px}body:before{content:"";position:fixed;inset:0;background:radial-gradient(ellipse at 50% 0%,rgba(229,9,20,.2),transparent 55%);pointer-events:none}.page{position:relative;width:min(100%,460px)}.brand{display:flex;justify-content:center;align-items:center;gap:10px;margin-bottom:26px;text-decoration:none;color:#fff;font-size:25px;font-weight:900}.mark{width:40px;height:40px;border-radius:10px;background:#e50914;display:grid;place-items:center}.brand b{color:#e50914}.card{background:#141418;border:1px solid #292930;border-radius:22px;padding:30px;box-shadow:0 24px 80px #0008}h1{font-size:26px;margin:0 0 8px}.sub{color:#a1a1aa;font-size:14px;line-height:1.6;margin:0 0 22px}.tabs{display:grid;grid-template-columns:1fr 1fr;background:#09090b;border:1px solid #292930;border-radius:12px;padding:4px;margin-bottom:21px}.tab{border:0;border-radius:9px;padding:11px;color:#a1a1aa;background:transparent;font-weight:750;cursor:pointer}.tab.active{background:#e50914;color:#fff}.field{margin-bottom:15px}label{display:block;font-size:13px;font-weight:650;margin:0 0 7px}input{width:100%;height:47px;border-radius:10px;border:1px solid #34343d;background:#0b0b0d;color:#fff;padding:0 13px;outline:none}input:focus{border-color:#e50914;box-shadow:0 0 0 3px #e5091420}.pass{position:relative}.pass input{padding-right:65px}.toggle{position:absolute;right:10px;top:50%;transform:translateY(-50%);border:0;background:none;color:#aaa;font-size:12px;cursor:pointer}.forgot{display:block;text-align:right;color:#ff6269;font-size:13px;text-decoration:none;margin:-2px 0 17px}.submit{width:100%;height:48px;border:0;border-radius:99px;background:#e50914;color:white;font-weight:800;cursor:pointer}.submit:disabled{opacity:.55}.message{display:none;margin:0 0 14px;padding:11px;border-radius:9px;font-size:13px;line-height:1.5}.message.error{display:block;background:#7f1d1d33;border:1px solid #7f1d1d;color:#fecaca}.message.success{display:block;background:#065f4633;border:1px solid #065f46;color:#a7f3d0}.notice{margin-top:16px;padding:11px;border-radius:10px;background:#78350f20;border:1px solid #78350f66;color:#fcd34d;font-size:12px;line-height:1.5}.back{display:block;text-align:center;margin-top:20px;color:#a1a1aa;text-decoration:none;font-size:13px}[hidden]{display:none!important}@media(max-width:480px){.card{padding:23px 19px}}
</style></head>
<body><main class="page"><a class="brand" href="index.html"><span class="mark">S</span><span>SHORT <b>Rells</b></span></a><section class="card"><h1 id="heading">Welcome back</h1><p class="sub" id="subtitle">Sign in to save your favorites and continue watching.</p>
<div class="tabs"><button class="tab active" id="signin-tab" type="button">Sign In</button><button class="tab" id="register-tab" type="button">Create Account</button></div>
<div id="message" class="message" role="status" aria-live="polite"></div>
<form id="auth-form"><div class="field" id="name-field" hidden><label for="display-name">Display name</label><input id="display-name" type="text" autocomplete="name" placeholder="Your name"></div>
<div class="field"><label for="email">Email address</label><input id="email" type="email" autocomplete="email" required placeholder="you@example.com"></div>
<div class="field"><label for="password">Password</label><div class="pass"><input id="password" type="password" autocomplete="current-password" minlength="6" required placeholder="At least 6 characters"><button class="toggle" id="toggle-password" type="button">Show</button></div></div>
<div class="field" id="confirm-field" hidden><label for="confirm-password">Confirm password</label><div class="pass"><input id="confirm-password" type="password" minlength="6" placeholder="Repeat your password"><button class="toggle" id="toggle-confirm" type="button">Show</button></div></div>
<a href="#" class="forgot" id="forgot-link">Forgot password?</a><button class="submit" id="submit-button" type="submit">Sign In</button></form>
<div class="notice" id="config-notice">Firebase is not configured yet. Add your Firebase web configuration below in this file and in index.html, then set FIREBASE_CONFIGURED to true. No fake login is used.</div></section><a class="back" href="index.html">← Back to SHORT Rells</a></main>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script>
// Paste the same Firebase Web App configuration in index.html and this file.
const FIREBASE_CONFIGURED=true;
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBJ0oeQC5yQ-xEHDDpwXsGOM0KyCmd0xpk",
  authDomain: "shortrells-22139.firebaseapp.com",
  projectId: "shortrells-22139",
  storageBucket: "shortrells-22139.firebasestorage.app",
  messagingSenderId: "614316660720",
  appId: "1:614316660720:web:2ec1dc03e382c40aaa2f35",
  measurementId: "G-QH8E4LZ15K"
};
const $=id=>document.getElementById(id);let mode="signin",auth=null;
function message(text,type){const el=$("message");el.textContent=text;el.className="message "+type}function clearMessage(){$("message").textContent="";$("message").className="message"}
function setMode(value){mode=value;const reg=value==="register";$("signin-tab").classList.toggle("active",!reg);$("register-tab").classList.toggle("active",reg);$("name-field").hidden=!reg;$("confirm-field").hidden=!reg;$("forgot-link").hidden=reg;$("heading").textContent=reg?"Create your account":"Welcome back";$("subtitle").textContent=reg?"Join SHORT Rells to save your favorites and watch history.":"Sign in to save your favorites and continue watching.";$("submit-button").textContent=reg?"Create Account":"Sign In";clearMessage()}
function toggle(input,button){const el=$(input);el.type=el.type==="password"?"text":"password";$(button).textContent=el.type==="password"?"Show":"Hide"}
$("signin-tab").onclick=()=>setMode("signin");$("register-tab").onclick=()=>setMode("register");$("toggle-password").onclick=()=>toggle("password","toggle-password");$("toggle-confirm").onclick=()=>toggle("confirm-password","toggle-confirm");
if(FIREBASE_CONFIGURED&&window.firebase){try{if(!firebase.apps.length)firebase.initializeApp(FIREBASE_CONFIG);auth=firebase.auth();$("config-notice").hidden=true;auth.onAuthStateChanged(user=>{if(user){const p=new URLSearchParams(location.search),next=p.get("next");const safe=next&&!next.startsWith("//")&&!next.includes(":")?next:"index.html";location.replace(safe)}})}catch(e){message("Firebase initialization failed. Check your configuration.","error")}}
$("forgot-link").onclick=async e=>{e.preventDefault();clearMessage();if(!auth)return message("Firebase is not configured. Password reset is unavailable until setup is complete.","error");const email=$("email").value.trim();if(!email)return message("Enter your email address first.","error");try{await auth.sendPasswordResetEmail(email);message("Password reset email sent. Check your inbox.","success")}catch(err){message(err.message||"Could not send reset email.","error")}};
$("auth-form").onsubmit=async e=>{e.preventDefault();clearMessage();if(!auth)return message("Firebase is not configured yet. Add your Firebase config to enable real sign in and registration.","error");const email=$("email").value.trim(),password=$("password").value,button=$("submit-button");try{button.disabled=true;if(mode==="register"){const name=$("display-name").value.trim(),confirm=$("confirm-password").value;if(!name)return message("Please enter your display name.","error");if(password.length<6)return message("Password must contain at least 6 characters.","error");if(password!==confirm)return message("Passwords do not match.","error");const credential=await auth.createUserWithEmailAndPassword(email,password);await credential.user.updateProfile({displayName:name});await credential.user.sendEmailVerification();await auth.signOut();message("Account created. Check your inbox and verify your email before signing in.","success");return}else{const signed=await auth.signInWithEmailAndPassword(email,password);if(!signed.user.emailVerified){await auth.signOut();return message("Please verify your email using the link we sent before signing in.","error")}}message("Success. Redirecting…","success");const p=new URLSearchParams(location.search),next=p.get("next"),safe=next&&!next.startsWith("//")&&!next.includes(":")?next:"index.html";location.replace(safe)}catch(err){message(err.message||"Authentication failed.","error")}finally{button.disabled=false}};
if(new URLSearchParams(location.search).get("mode")==="register")setMode("register");
</script></body></html>
